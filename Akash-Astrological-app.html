<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akash Astrological</title>
<meta name="theme-color" content="#12383d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#12282b;--mut:#5a6f72;--line:#cfdcdb;--acc:#b86e00;--accbg:#fff1d6;--hd:#12383d;--hdink:#f6e7c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1d20;--card:#132b2f;--ink:#e8f0ef;--mut:#9bb3b5;--line:#244247;--acc:#f0b33c;--accbg:#3a2f12;--hd:#071417;--hdink:#f0b33c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1d20;--card:#132b2f;--ink:#e8f0ef;--mut:#9bb3b5;--line:#244247;--acc:#f0b33c;--accbg:#3a2f12;--hd:#071417;--hdink:#f0b33c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 "Noto Sans Sinhala","Iskoola Pota","Noto Sans Tamil","Latha",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{background:var(--hd);color:var(--hdink);padding:18px 16px 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.02em}
header p{margin:0;font-size:13px;opacity:.8}
.brand{display:flex;align-items:center;gap:12px}
.brand .av{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--hdink);background:var(--bg)}
.brand .nm{margin-top:2px;font-size:12px;line-height:1.4;opacity:.95;font-weight:600}

nav{display:flex;gap:6px;overflow-x:auto;margin-top:10px}
nav button{flex:none;border:1px solid var(--line);background:transparent;color:inherit;border-radius:20px;padding:5px 13px;font:inherit;font-size:14px}
nav button.on{background:var(--acc);color:#12282b;border-color:var(--acc);font-weight:600}
main{max-width:720px;margin:0 auto;padding:14px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 8px}h3{font-size:16px;margin:12px 0 4px}
label{display:block;font-size:14px;color:var(--mut);margin-top:10px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#12282b;font:inherit;font-weight:800}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:400}
.big{font-size:26px;font-weight:800;color:var(--acc)}
.mut{color:var(--mut);font-size:14px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr.cur td{background:var(--accbg);font-weight:600}
.chart{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,76px);border:2px solid var(--acc);max-width:360px;margin:auto}
.chart div{border:1px solid var(--line);padding:3px;font-size:12px;line-height:1.35;overflow:hidden}
.chart .c{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--acc);font-weight:800;font-size:14px}
.chart small{color:var(--mut);display:block;font-size:10px}
.chart .lg{background:var(--accbg)}
.lang{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 10px}
.lang button{border:1px solid var(--line);background:transparent;color:inherit;border-radius:20px;padding:3px 12px;font:inherit;font-size:14px}
.lang button.on{background:var(--acc);color:#12282b;border-color:var(--acc);font-weight:600}
.tag{display:inline-block;background:var(--accbg);color:var(--acc);border-radius:6px;padding:0 8px;font-size:13px;margin-left:6px}
.hand img{width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-top:8px}
.price{border:2px dashed var(--acc);text-align:center}
a.call{display:block;text-align:center;margin-top:10px;padding:12px;border-radius:10px;background:var(--hd);color:var(--hdink);text-decoration:none;font-weight:800}
.hid{display:none}
textarea{width:100%;min-height:70px;margin-top:6px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
.chart{grid-template-rows:repeat(4,84px)}
.good{color:#1f8a4c;font-weight:600}.bad{color:#c0392b;font-weight:600}
@media print{header,nav,.btn,.noprint,body::before{display:none!important}:root:not([data-theme="x"]){color-scheme:light;--bg:#fff;--card:#fff;--ink:#000;--mut:#333;--line:#999;--acc:#8a5200;--accbg:#fff1d6}.card{break-inside:avoid}}
</style>
</head>
